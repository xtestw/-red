<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red-Stock</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #667eea;
            --primary-hover: #5568d3;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 20s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10%, -10%) scale(1.1); }
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }
        
        .filter-section {
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        
        .filter-section:hover {
            box-shadow: var(--shadow-lg);
        }
        
        .filter-section h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-section h3::before {
            content: '🔍';
            font-size: 24px;
        }
        
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .filter-item {
            flex: 1;
            min-width: 200px;
        }
        
        .filter-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: var(--transition);
            background: var(--card-bg);
        }
        
        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: var(--secondary-color);
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: var(--success-color);
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-info {
            background: var(--info-color);
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        .stock-list {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: var(--transition);
        }
        
        .stock-list:hover {
            box-shadow: var(--shadow-lg);
        }
        
        .stock-list table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .stock-list th {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .stock-list td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: var(--transition);
        }
        
        .stock-list tr {
            transition: var(--transition);
        }
        
        .stock-list tr:hover {
            background: linear-gradient(90deg, #f8f9fa 0%, #ffffff 100%);
            transform: scale(1.01);
            box-shadow: var(--shadow-sm);
        }
        
        .stock-list tr:last-child td {
            border-bottom: none;
        }
        
        .stock-detail {
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius);
            margin-top: 24px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stock-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .stock-detail-header h2 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 600;
        }
        
        .chart-container {
            width: 100%;
            height: 450px;
            margin-bottom: 24px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--card-bg);
            box-shadow: var(--shadow-sm);
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0;
        }
        
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            position: relative;
            margin-bottom: -2px;
        }
        
        .tab:hover {
            color: var(--primary-color);
            background: rgba(102, 126, 234, 0.05);
        }
        
        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.05);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px;
            background: var(--card-bg);
        }
        
        .pagination button {
            padding: 10px 18px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            color: var(--text-primary);
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .pagination span {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            padding: 16px 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid var(--danger-color);
            box-shadow: var(--shadow-sm);
        }
        
        .moneyflow-table {
            width: 100%;
            margin-top: 24px;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .moneyflow-table thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        
        .moneyflow-table th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }
        
        .moneyflow-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        
        .moneyflow-table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }
        
        .positive {
            color: var(--danger-color);
            font-weight: 600;
        }
        
        .negative {
            color: var(--success-color);
            font-weight: 600;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            
            .header {
                padding: 24px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .filter-section {
                padding: 20px;
            }
            
            .filter-item {
                min-width: 100%;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .stock-list {
                overflow-x: auto;
            }
            
            .stock-list table {
                min-width: 800px;
            }
            
            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            
            .tab {
                white-space: nowrap;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        
        /* 复选框样式 */
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        
        /* 数字格式化 */
        .number {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Red-Stock</h1>
            <p>实时股票数据查询与分析平台 | 专业 · 高效 · 智能</p>
        </div>
        
        <!-- 筛选区域 -->
        <div class="filter-section">
            <h3>股票筛选</h3>
            <div class="filter-row">
                <div class="filter-item">
                    <label>关键词搜索（代码/名称）</label>
                    <input type="text" id="keyword" placeholder="输入股票代码或名称">
                </div>
                <div class="filter-item">
                    <label>行业</label>
                    <select id="industry">
                        <option value="">全部行业</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>市场</label>
                    <select id="market">
                        <option value="">全部市场</option>
                    </select>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-item">
                    <label>最小市值（万元）</label>
                    <input type="number" id="min_market_value" placeholder="最小市值">
                </div>
                <div class="filter-item">
                    <label>最大市值（万元）</label>
                    <input type="number" id="max_market_value" placeholder="最大市值">
                </div>
                <div class="filter-item">
                    <label>最小市盈率</label>
                    <input type="number" id="min_pe" placeholder="最小PE">
                </div>
                <div class="filter-item">
                    <label>最大市盈率</label>
                    <input type="number" id="max_pe" placeholder="最大PE">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="searchStocks()">🔍 搜索</button>
                <button class="btn btn-secondary" onclick="resetFilters()">🔄 重置</button>
                <button class="btn btn-success" onclick="showFavorites()">⭐ 我的收藏</button>
                <button class="btn btn-info" onclick="showCompare()">⚖️ 股票对比</button>
                <button class="btn btn-info" onclick="showIndustryStats()">📊 行业统计</button>
            </div>
        </div>
        
        <!-- 股票列表 -->
        <div class="stock-list">
            <div id="loading" class="loading" style="display: none;">加载中...</div>
            <div id="error" class="error" style="display: none;"></div>
            <table id="stockTable" style="display: none;">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选</th>
                        <th>股票代码</th>
                        <th>股票名称</th>
                        <th>行业</th>
                        <th>市场</th>
                        <th>总市值（万元）</th>
                        <th>市盈率</th>
                        <th>市净率</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                </tbody>
            </table>
            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
        
        <!-- 股票详情 -->
        <div id="stockDetail" class="stock-detail" style="display: none;">
            <div class="stock-detail-header">
                <h2 id="stockName"></h2>
                <button class="btn btn-secondary" onclick="closeDetail()">关闭</button>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="showTab('daily')">日线</button>
                <button class="tab" onclick="showTab('weekly')">周线</button>
                <button class="tab" onclick="showTab('monthly')">月线</button>
                <button class="tab" onclick="showTab('moneyflow')">资金流向</button>
                <button class="tab" onclick="showTab('indicators')">技术指标</button>
            </div>
            <div class="btn-group" style="margin-bottom: 20px;">
                <button class="btn btn-success" onclick="exportStockData(currentStockCode, 'daily', 'csv')">📥 导出CSV</button>
                <button class="btn btn-success" onclick="exportStockData(currentStockCode, 'daily', 'excel')">📊 导出Excel</button>
            </div>
            <div id="chartContainer" class="chart-container"></div>
            <div id="moneyflowContainer"></div>
            <div id="indicatorsContainer"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        let currentPage = 1;
        let totalPages = 1;
        let currentStockCode = '';
        let currentTab = 'daily';
        let dailyChart = null;
        let weeklyChart = null;
        let monthlyChart = null;
        let moneyflowChart = null;
        
        // 页面加载时初始化
        window.onload = function() {
            loadIndustries();
            loadMarkets();
            searchStocks();
        };
        
        // 加载行业列表
        async function loadIndustries() {
            try {
                const response = await fetch(`${API_BASE}/industries`);
                const result = await response.json();
                if (result.code === 0) {
                    const select = document.getElementById('industry');
                    result.data.forEach(industry => {
                        const option = document.createElement('option');
                        option.value = industry;
                        option.textContent = industry;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载行业列表失败:', error);
            }
        }
        
        // 加载市场列表
        async function loadMarkets() {
            try {
                const response = await fetch(`${API_BASE}/markets`);
                const result = await response.json();
                if (result.code === 0) {
                    const select = document.getElementById('market');
                    result.data.forEach(market => {
                        const option = document.createElement('option');
                        option.value = market;
                        option.textContent = market;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载市场列表失败:', error);
            }
        }
        
        // 搜索股票
        async function searchStocks(page = 1) {
            currentPage = page;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const table = document.getElementById('stockTable');
            const tbody = document.getElementById('stockTableBody');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            
            const params = new URLSearchParams({
                page: page,
                per_page: 50
            });
            
            const keyword = document.getElementById('keyword').value;
            const industry = document.getElementById('industry').value;
            const market = document.getElementById('market').value;
            const min_mv = document.getElementById('min_market_value').value;
            const max_mv = document.getElementById('max_market_value').value;
            const min_pe = document.getElementById('min_pe').value;
            const max_pe = document.getElementById('max_pe').value;
            
            if (keyword) params.append('keyword', keyword);
            if (industry) params.append('industry', industry);
            if (market) params.append('market', market);
            if (min_mv) params.append('min_market_value', min_mv);
            if (max_mv) params.append('max_market_value', max_mv);
            if (min_pe) params.append('min_pe', min_pe);
            if (max_pe) params.append('max_pe', max_pe);
            
            try {
                const response = await fetch(`${API_BASE}/stocks?${params}`);
                const result = await response.json();
                
                loading.style.display = 'none';
                
                if (result.code === 0) {
                    table.style.display = 'table';
                    tbody.innerHTML = '';
                    
                    result.data.stocks.forEach(stock => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><input type="checkbox" class="stock-checkbox" value="${stock.ts_code}" data-name="${stock.name}"></td>
                            <td>${stock.symbol}</td>
                            <td>${stock.name}</td>
                            <td>${stock.industry || '-'}</td>
                            <td>${stock.market || '-'}</td>
                            <td class="number">${stock.total_mv ? stock.total_mv.toLocaleString() : '-'}</td>
                            <td class="number">${stock.pe ? stock.pe.toFixed(2) : '-'}</td>
                            <td class="number">${stock.pb ? stock.pb.toFixed(2) : '-'}</td>
                            <td>
                                <button class="btn" onclick="showStockDetail('${stock.ts_code}')" style="margin-right: 8px; padding: 8px 16px; font-size: 13px;">📊 详情</button>
                                <button class="btn btn-secondary" onclick="toggleFavorite('${stock.ts_code}')" id="fav_${stock.ts_code}" style="padding: 8px 16px; font-size: 13px;">⭐ 收藏</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    // 更新收藏状态
                    updateFavoriteStatus();
                    
                    totalPages = result.data.total_pages;
                    updatePagination();
                } else {
                    error.style.display = 'block';
                    error.textContent = result.message || '查询失败';
                }
            } catch (error) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = '网络错误: ' + error.message;
            }
        }
        
        // 更新分页
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.style.display = 'flex';
            pagination.innerHTML = `
                <button onclick="searchStocks(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${currentPage} 页 / 共 ${totalPages} 页</span>
                <button onclick="searchStocks(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>
            `;
        }
        
        // 重置筛选条件
        function resetFilters() {
            document.getElementById('keyword').value = '';
            document.getElementById('industry').value = '';
            document.getElementById('market').value = '';
            document.getElementById('min_market_value').value = '';
            document.getElementById('max_market_value').value = '';
            document.getElementById('min_pe').value = '';
            document.getElementById('max_pe').value = '';
            searchStocks(1);
        }
        
        // 显示股票详情
        async function showStockDetail(ts_code) {
            currentStockCode = ts_code;
            const detail = document.getElementById('stockDetail');
            detail.style.display = 'block';
            
            // 获取股票基本信息
            try {
                const response = await fetch(`${API_BASE}/stocks/${ts_code}`);
                const result = await response.json();

        // 收藏/取消收藏
        async function toggleFavorite(ts_code) {
            const btn = document.getElementById(`fav_${ts_code}`);
            const isFavorited = btn.textContent === '已收藏';
            
            try {
                if (isFavorited) {
                    // 取消收藏
                    const response = await fetch(`${API_BASE}/favorites/${ts_code}?user_id=default`, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    if (result.code === 0) {
                        btn.textContent = '收藏';
                        btn.classList.remove('btn-secondary');
                    }
                } else {
                    // 添加收藏
                    const response = await fetch(`${API_BASE}/favorites`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ts_code: ts_code, user_id: 'default'})
                    });
                    const result = await response.json();
                    if (result.code === 0) {
                        btn.textContent = '已收藏';
                        btn.classList.add('btn-secondary');
                    }
                }
            } catch (error) {
                console.error('操作失败:', error);
                alert('操作失败: ' + error.message);
            }
        }

                        xAxis: { 
                            type: 'category', 
                            data: dates,
                            boundaryGap: false
                        },
                        yAxis: { 
                            type: 'value',
                            splitLine: {
                                show: true,
                                lineStyle: { type: 'dashed' }
                            }
                        },
                        series: [
                            { 
                                name: 'MACD', 
                                type: 'line', 
                                data: macd,
                                smooth: true,
                                itemStyle: { color: '#667eea' },
                                lineStyle: { width: 2 }
                            },
                            { 
                                name: '信号线', 
                                type: 'line', 
                                data: signal,
                                smooth: true,
                                itemStyle: { color: '#f093fb' },
                                lineStyle: { width: 2 }
                            },
                            { 
                                name: '柱状图', 
                                type: 'bar', 
                                data: hist,
                                itemStyle: {
                                    color: function(params) {
                                        return params.value >= 0 ? '#28a745' : '#dc3545';
                                    }
                                }
                            }
                        ]
                    });
                } else {
                    indicatorsContainer.innerHTML = '<p>暂无技术指标数据</p>';
                }
            } catch (error) {
                console.error('加载技术指标失败:', error);
                indicatorsContainer.innerHTML = '<p class="error">加载失败: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
